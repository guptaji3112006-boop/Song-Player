<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spotify/FAVICON.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <img
          src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png"
          alt="Spotify Logo"
        />
      </div>

      <div class="navSearch">
        <div class="circle">
          <i class="fa-solid fa-house"></i>
        </div>

        <div class="searchBar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search any song worldwide..." autocomplete="off" />
          
          <div class="search-results" id="searchResults">
             <!-- Search results will populate here -->
          </div>
        </div>

        <div class="lastSec">
          <div class="premium">Explore premium</div>
          <div class="install">Install App</div>
          <div class="notification">
            <i class="fa-solid fa-bell"></i>
          </div>
          <div class="profile">
            <i class="fa-solid fa-user"></i>
          </div>
        </div>
      </div>
    </nav>

    <div class="main">
      <div class="left">
        <div class="header">
          <div class="library"><h3><i class="fa-solid fa-book"></i> Your Library</h3></div>
          <div class="create"><i class="fa-solid fa-plus"></i></div>
        </div>
        
        <div class="playlists">
          <h4>Playlists</h4>
          <ul id="playlistContainer">
            <!-- Playlist items injected via JS -->
          </ul>
        </div>
      </div>
      
      <div class="right">
        <div class="category-pills">
            <button class="pill active" data-category="All">All</button>
            <button class="pill" data-category="Bollywood">Bollywood</button>
            <button class="pill" data-category="Hollywood">Hollywood</button>
            <button class="pill" data-category="Punjabi">Punjabi</button>
            <button class="pill" data-category="Haryanvi">Haryanvi</button>
        </div>
        <h2 id="sectionTitle">All Mixes</h2>
        <div class="card-container" id="cardContainer">
          <!-- Cards injected via JS -->
        </div>
      </div>
    </div>

    <!-- Bottom sticky music player -->
    <div class="bottom-player">
      <div class="player-left">
        <img id="currentCover" src="https://i.scdn.co/image/ab67616d00001e0233bc5d16517fed8db985360c" style="display: none;" />
        <div class="song-info">
          <h4 id="currentTitle">Select a song</h4>
          <p id="currentArtist">Ready to play</p>
        </div>
        <i class="fa-regular fa-heart"></i>
      </div>
      
      <div class="player-center">
        <div class="player-controls">
          <i class="fa-solid fa-shuffle control-btn" id="shuffleBtn"></i>
          <i class="fa-solid fa-backward-step control-btn" id="prevBtn"></i>
          <i class="fa-solid fa-circle-play play-btn glow-btn" id="playBtn"></i>
          <i class="fa-solid fa-forward-step control-btn" id="nextBtn"></i>
          <i class="fa-solid fa-rotate-right control-btn" id="repeatBtn"></i>
        </div>
        <div class="progress-bar-container">
          <span id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress" id="progressFill"></div>
            <div class="progress-thumb"></div>
          </div>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      
      <div class="player-right">
        <i class="fa-solid fa-microphone"></i>
        <i class="fa-solid fa-bars"></i>
        <i class="fa-solid fa-desktop"></i>
        <i class="fa-solid fa-volume-high control-btn" id="muteBtn"></i>
        <div class="volume-bar" id="volumeBar">
            <div class="volume-progress" id="volumeFill" style="width: 100%;"></div>
            <div class="volume-thumb" style="left: 100%;"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
